name: Data pipeline

# Builds the data in the cloud. Day 2: download the latest 10-K for each company.
# Later days add parse -> chunk -> embed steps here.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/download.py
      - config.yaml
      - .github/workflows/pipeline.yml
  push:
    branches: [main]
    paths:
      - src/download.py
      - config.yaml
      - .github/workflows/pipeline.yml

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - name: Download 10-K filings from SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.download
      - name: Check one filing per company
        run: |
          expected=$(python -c "from src.config import load_config; print(len(load_config()['companies']))")
          found=$(ls data/raw/*.htm | wc -l)
          echo "expected=$expected found=$found"
          test "$found" -eq "$expected"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-filings
          path: data/raw/
          retention-days: 30
