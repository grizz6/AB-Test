name: Data pipeline

# Builds the data in the cloud:
#   download (SEC EDGAR) -> parse Item 1A -> chunk -> embed -> Supabase pgvector
# Pull requests write to a separate "ci" index so they never touch the "main" index.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/download.py
      - src/parse.py
      - src/chunk.py
      - src/index.py
      - config.yaml
      - requirements*.txt
      - .github/workflows/pipeline.yml
  push:
    branches: [main]
    paths:
      - src/download.py
      - src/parse.py
      - src/chunk.py
      - src/index.py
      - config.yaml
      - requirements*.txt
      - .github/workflows/pipeline.yml

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  INDEX_NAME: ${{ github.event_name == 'pull_request' && 'ci' || 'main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-index.txt

      - name: Download 10-K filings from SEC EDGAR
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -m src.download
      - name: Check one filing per company
        run: |
          expected=$(python -c "from src.config import load_config; print(len(load_config()['companies']))")
          found=$(ls data/raw/*.htm | wc -l)
          echo "expected=$expected found=$found"
          test "$found" -eq "$expected"

      - name: Extract Item 1A. Risk Factors
        run: python -m src.parse
      - name: Chunk sections
        run: python -m src.chunk

      - name: Embed and store in Supabase (index ${{ env.INDEX_NAME }})
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # optional: faster model download from Hugging Face
        run: python -m src.index --index-name "$INDEX_NAME"
      - name: Test search
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m src.index --index-name "$INDEX_NAME" --query "supply chain risk" --ticker TSLA
          python -m src.index --index-name "$INDEX_NAME" --query "cybersecurity breach"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-data
          path: |
            data/raw/
            data/sections/
            data/chunks.jsonl
          retention-days: 30
